name: Deploy Flutter Web to AWS Lightsail

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./multi_screen_navigation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Prepare SSH Key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}" | base64 -d > /home/runner/.ssh/deploy_key
          chmod 600 /home/runner/.ssh/deploy_key

      - name: Copy build files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key_path: /home/runner/.ssh/deploy_key
          port: ${{ secrets.LIGHTSAIL_PORT }}
          source: "multi_screen_navigation/build/web/"
          target: "/tmp/flutter_deploy"
          overwrite: true
          rm: false

      - name: Move files, set permissions, and reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key_path: /home/runner/.ssh/deploy_key
          port: ${{ secrets.LIGHTSAIL_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # deploy user owns /var/www/sucgang_app, so no sudo needed for file moves
            rm -rf /var/www/sucgang_app/build/web
            mkdir -p /var/www/sucgang_app/build
            mv /tmp/flutter_deploy/web /var/www/sucgang_app/build/web
            
            # sudo is used for permissions and service reload
            sudo chown -R deploy:www-data /var
